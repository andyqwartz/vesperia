<!DOCTYPE html>
<html lang="fr" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VESPERIA — contre-carte des silences urbains · Paris</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5.3.0/400-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.3.0/300.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.3.3/dist.min.js"></script>
</head>
<body>
<div id="map"></div>
<div id="grain"></div>
<header id="brand">
  <h1>Vesperia</h1>
  <p>contre-carte des silences urbains · paris</p>
  <p id="demo" hidden>données synthétiques de démonstration</p>
</header>
<section id="time">
  <div id="clock-words">mardi, <em>onze heures</em></div>
  <div id="clock">MAR 11:00</div>
  <div id="pulse"><span id="mean">—</span> froid moyen · <span id="lit">—</span> cellules allumées</div>
  <p id="fx" hidden></p>
  <nav id="controls">
    <button id="btn-mode" type="button">TYPIQUE</button>
    <button id="btn-now" type="button">MAINTENANT</button>
    <button id="btn-play" type="button" aria-pressed="false">LECTURE</button>
    <button id="btn-derive" type="button">DÉRIVE</button>
    <button id="btn-official" type="button" aria-pressed="false">CARTE OFFICIELLE</button>
    <button id="btn-tune" type="button" aria-expanded="false">RÉGLAGES</button>
    <button id="listen" type="button" hidden>ÉCOUTE</button>
  </nav>
</section>
<aside id="panel-left">
  <div id="weights"></div>
  <label id="iso-label"><input type="checkbox" id="toggle-isolated" checked> masquer les zones isolées</label>
</aside>
<aside id="panel-right">
  <h2>fenêtres de silence</h2>
  <p id="top-note">les lieux froids maintenant, classés par la durée de leur silence</p>
  <ol id="top"></ol>
</aside>
<div id="cursor" hidden></div>
<section id="derive" hidden></section>
<footer id="foot">
  <div id="ribbon" tabindex="0" aria-label="Semaine, 168 heures"></div>
  <div id="days"></div>
  <a id="sources-link" href="#sources">fondement &amp; sources</a>
</footer>
<section id="sources" hidden></section>
<script type="module" src="js/app.js"></script>
</body>
</html>
